# ============================================================
# Render Blueprint (render.yaml)
# Tournament Management System
# ============================================================

services:
  # ----------------------------------------------------------
  # 1. Backend Web Service (Node.js Express API)
  # ----------------------------------------------------------
  - type: web
    name: tournament-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTO_MIGRATE
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # DATABASE_URL will be added in Render dashboard or linked from your MySQL provider
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        fromService:
          type: web
          name: tournament-frontend
          property: host

  # ----------------------------------------------------------
  # 2. Frontend Static Site (React + Vite SPA)
  # ----------------------------------------------------------
  - type: web
    name: tournament-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
      - type: rewrite
        source: /assets/*
        destination: /assets/*
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tournament-backend
          property: host

